<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль - DDE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="logo">DDE</div>
        
        <div class="header">
            <h1>Новый пароль</h1>
            <p>Придумайте новый надежный пароль</p>
        </div>

        <form id="newPasswordForm" class="form">
            <div class="input-group">
                <label for="password">Новый пароль</label>
                <input type="password" id="password" placeholder="Минимум 10 символов" required minlength="10">
                <span class="error-message" id="passwordError"></span>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Сохранить пароль</button>
            <div id="formMessage" class="form-message"></div>
        </form>
    </div>

    <script type="module" src="new-password.js"></script>
</body>
</html>
