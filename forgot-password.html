<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля - DDE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="logo">DDE</div>
        
        <div class="header">
            <h1>Забыли пароль?</h1>
            <p>Введите ваш E-Mail для восстановления</p>
        </div>

        <form id="forgotPasswordForm" class="form">
            <div class="input-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" placeholder="brawlstars@gmail.com" required>
                <span class="error-message" id="emailError"></span>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Отправить</button>
            <div id="formMessage" class="form-message"></div>
        </form>

        <div class="footer">
            <a href="index.html">Вернуться ко входу</a>
        </div>
    </div>

    <script type="module" src="forgot-password.js"></script>
</body>
</html>
