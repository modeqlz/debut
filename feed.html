<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента - DDE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css"> <!-- Базовый макет с сайдбаром -->
    <link rel="stylesheet" href="feed.css"> <!-- Специфичные стили для ленты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Левое боковое меню -->
        <aside class="sidebar">
            <nav class="nav-menu">
                <a href="feed.html" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <path d="M2 15h10"></path>
                        <path d="M2 18h10"></path>
                    </svg>
                    Лента
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Поиск
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Магазин
                </a>
                <a href="#" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    Уведомления
                </a>
                <a href="profile.html" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Профиль
                </a>
            </nav>
            
            <a href="index.html" class="nav-item logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Выход
            </a>
        </aside>

        <!-- Основной контент ленты -->
        <main class="main-content">
            <div class="feed-container">
                
                <!-- Вкладки ленты -->
                <div class="feed-tabs-wrapper">
                    <button class="feed-tab-btn active">Для вас</button>
                    <button class="feed-tab-btn">Лента магазина</button>
                    <button class="feed-tab-btn">Подписчики</button>
                </div>

                <!-- Блок создания поста -->
                <div class="feed-create-post">
                    <div class="feed-post-input-wrapper">
                        <div class="feed-post-avatar"></div>
                        <input type="text" class="feed-post-input" placeholder="Что нового?">
                    </div>
                    <div class="feed-post-actions">
                        <button class="feed-publish-btn" disabled>Опубликовать</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module" src="feed.js"></script>
</body>
</html>
